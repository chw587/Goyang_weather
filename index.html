<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goyang City Weather</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/index.css">

    <script src="./js/index.js" defer></script>

</head>

<body>
    <header>
        <img class="logo" src="./img/logo.gif" alt="logo">
        <p>고양시청 기상정보 모니터링</p>
    </header>

    <main>
        <div class="item temp">
            <div class="item_header">
                <div class="item_title">
                    <p>기온</p>
                    <span>(Temperature)</span>
                </div>

                <div class="item_state"></div>
            </div>

            <div class="item_main">
                <div class="icon">
                    <svg class="item_icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 4.5a2 2 0 0 0-4 0v9.17a5 5 0 1 0 4 0V4.5z" />

                        <line x1="14" y1="6.5" x2="12.2" y2="6.5" />
                        <line x1="14" y1="8.5" x2="12.2" y2="8.5" />
                        <line x1="14" y1="11" x2="12.2" y2="11" />

                        <circle cx="12" cy="18.2" r="2.2" />
                    </svg>
                </div>

                <div>
                    <p>6.2</p>
                    <span>°C</span>
                </div>
            </div>
        </div>

        <div class="item dust">
            <div class="item_header">
                <div class="item_title">
                    <p>미세먼지</p>
                    <span>(PM10)</span>
                </div>

                <div class="item_state success"></div>
            </div>

            <div class="item_main">
                <div class="graph_wrap">
                    <svg class="graph" viewBox="0 0 100 100">
                        <circle class="graph_bg" cx="50" cy="50" r="45"></circle>
                        <!-- 진행률 -->
                        <circle class="graph_bar" cx="50" cy="50" r="45"></circle>
                    </svg>

                    <div class="graph_text">22</div>
                </div>

                <p class="state_text">좋음</p>
            </div>
        </div>

        <div class="item dust">
            <div class="item_header">
                <div class="item_title">
                    <p>초미세먼지</p>
                    <span>(PM2.5)</span>
                </div>

                <div class="item_state success"></div>
            </div>

            <div class="item_main">
                <div class="graph_wrap">
                    <svg class="graph" viewBox="0 0 100 100">
                        <circle class="graph_bg" cx="50" cy="50" r="45"></circle>
                        <!-- 진행률 -->
                        <circle class="graph_bar" cx="50" cy="50" r="45"></circle>
                    </svg>

                    <div class="graph_text">30</div>
                </div>

                <p class="state_text">좋음</p>
            </div>
        </div>

        <div class="item surface_temp">
            <div class="item_header">
                <div class="item_title">
                    <p>노면온도</p>
                    <span>(Surface Temperature)</span>
                </div>

                <div class="item_state"></div>
            </div>

            <div class="item_main">
                <div class="icon">
                    <svg class="item_icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12 3.5a3.5 3.5 0 0 0-3.5 3.5c0 2.5 3.5 5.5 3.5 5.5s3.5-3 3.5-5.5A3.5 3.5 0 0 0 12 3.5z" />
                        <circle cx="12" cy="7" r="1" />

                        <path d="M4 14.5v7l5.33 2 5.34-2 5.33 2v-7l-5.33-2-5.34 2-5.33-2z" />

                        <line x1="9.33" y1="16.5" x2="9.33" y2="23.5" />
                        <line x1="14.67" y1="14.5" x2="14.67" y2="21.5" />
                    </svg>
                </div>

                <div>
                    <p>10.4</p>
                    <span>°C</span>
                </div>
            </div>
        </div>

        <div class="item humidity">
            <div class="item_header">
                <div class="item_title">
                    <p>습도</p>
                    <span>(Humidity)</span>
                </div>

                <div class="item_state success"></div>
            </div>

            <div class="item_main">
                <div class="icon">
                    <svg class="item_icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.5C12 2.5 5 9.5 5 14.5A7 7 0 0 0 19 14.5C19 9.5 12 2.5 12 2.5Z" />

                        <line x1="14.5" y1="11.5" x2="9.5" y2="16.5" />

                        <circle cx="10" cy="12" r="1.2" />

                        <circle cx="14" cy="16" r="1.2" />
                    </svg>
                </div>

                <div>
                    <p>39</p>
                    <span>%</span>
                </div>
            </div>
        </div>

        <div class="item wind_speed">
            <div class="item_header">
                <div class="item_title">
                    <p>풍속</p>
                    <span>(Wind Speed)</span>
                </div>

                <div class="item_state success"></div>
            </div>

            <div class="item_main">
                <div class="icon">
                    <svg class="item_icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 8h11.5a2.5 2.5 0 0 0 1.5-4 2 2 0 0 0-3 1" />

                        <path d="M5 11h14.5a2.5 2.5 0 0 1 0 5 2 2 0 0 1-2-2" />

                        <path d="M3 15h11a3 3 0 0 1 0 6 2.5 2.5 0 0 1-2.5-3" />
                    </svg>
                </div>

                <div>
                    <p>1</p>
                    <span>m/s</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
